name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TESTING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio fakeredis ruff
      - name: Lint
        run: ruff check . --select E9,F63,F7,F82  # syntax/undefined-name errors only; don't block on style
      - name: Test
        run: pytest tests/ -v

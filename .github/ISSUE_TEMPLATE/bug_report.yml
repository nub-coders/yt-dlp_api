name: Bug report
description: Report a problem with the API or bot
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what actually happened?
    validations:
      required: true
  - type: input
    id: endpoint
    attributes:
      label: Endpoint / command
      description: e.g. GET /stream?q=... or /status
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      render: shell
  - type: input
    id: deploy
    attributes:
      label: How are you running it?
      description: Docker Compose, local `python3 main.py`, etc.
